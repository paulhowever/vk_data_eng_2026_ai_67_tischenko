apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-map
  namespace: hh-lake
spec:
  completionMode: Indexed
  completions: 8
  parallelism: 4
  backoffLimitPerIndex: 2
  maxFailedIndexes: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pairs
        run: indexed
    spec:
      restartPolicy: Never
      containers:
        - name: pairs
          image: hhlake-pairs:hw5
          imagePullPolicy: IfNotPresent
          args: ["map", "--parts", "8", "--chunk-mib", "32", "--run", "indexed"]
          envFrom:
            - secretRef:
                name: hh-lake-s3
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.hh-lake.svc.cluster.local:9000
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 500m
              memory: 208Mi
            limits:
              cpu: "1"
              memory: 208Mi
