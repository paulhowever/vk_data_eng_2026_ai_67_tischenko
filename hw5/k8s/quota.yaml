apiVersion: v1
kind: Namespace
metadata:
  name: team-php
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: team-php-quota
  namespace: team-php
spec:
  hard:
    pods: "4"
    requests.cpu: "2"
    requests.memory: 512Mi
    limits.cpu: "4"
    limits.memory: 512Mi
---
apiVersion: v1
kind: LimitRange
metadata:
  name: team-php-defaults
  namespace: team-php
spec:
  limits:
    - type: Container
      default:
        cpu: "1"
        memory: 208Mi
      defaultRequest:
        cpu: 500m
        memory: 208Mi
      max:
        memory: 512Mi
