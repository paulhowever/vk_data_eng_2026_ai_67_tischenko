apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-high
  namespace: hh-lake
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pairs
        run: high
    spec:
      priorityClassName: batch-high
      restartPolicy: Never
      containers:
        - name: pairs
          image: hhlake-pairs:hw5
          imagePullPolicy: IfNotPresent
          args: ["full", "--chunk-mib", "32", "--out", "results/k8s/high"]
          envFrom:
            - secretRef:
                name: hh-lake-s3
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.hh-lake.svc.cluster.local:9000
          resources:
            requests:
              cpu: "6"
              memory: 208Mi
            limits:
              cpu: "6"
              memory: 208Mi
