apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch-low
value: 1000
globalDefault: false
preemptionPolicy: Never
description: Background batch recomputation, may be preempted
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: batch-high
value: 100000
globalDefault: false
preemptionPolicy: PreemptLowerPriority
description: Urgent report, may preempt batch-low
