apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-reduce
  namespace: hh-lake
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: pairs
        run: reduce
    spec:
      restartPolicy: Never
      containers:
        - name: pairs
          image: hhlake-pairs:hw5
          imagePullPolicy: IfNotPresent
          args: ["reduce", "--parts", "8", "--run", "indexed"]
          envFrom:
            - secretRef:
                name: hh-lake-s3
          env:
            - name: S3_ENDPOINT
              value: http://rustfs.hh-lake.svc.cluster.local:9000
          resources:
            requests:
              cpu: 500m
              memory: 208Mi
            limits:
              cpu: "1"
              memory: 208Mi
